<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — AnuAlgo</title>
    <style>
        :root {
            --bg: #030712;
            --surface: #0f172a;
            --border: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            line-height: 1.7;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background: radial-gradient(circle at 50% 20%, rgba(34, 197, 94, 0.05) 0%, transparent 50%), linear-gradient(180deg, var(--bg) 0%, rgba(3, 7, 18, 0.95) 100%);
        }
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            opacity: 0.6;
        }
        nav {
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 1.25rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-weight: 800; font-size: 1.35rem; color: #fff; letter-spacing: -0.03em; }
        .logo span { color: var(--accent); }
        nav div a { color: var(--text-muted); text-decoration: none; margin-left: 2.5rem; font-size: 0.95rem; font-weight: 500; transition: color 0.2s; }
        nav div a:hover, nav div a.active { color: var(--accent); }

        .container {
            max-width: 800px;
            margin: 6rem auto;
            padding: 0 2rem;
            position: relative;
            z-index: 1;
        }
        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 1.5rem;
            color: #fff;
        }
        h1 span { color: var(--accent); }
        .contact-box {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 3rem;
            margin-top: 2rem;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.08);
        }
        .contact-box p {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }
        .email-link {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
            display: inline-block;
            word-break: break-all;
            transition: opacity 0.2s;
        }
        .email-link:hover { opacity: 0.8; }

        footer {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            margin-top: 8rem;
            font-size: 0.9rem;
            position: relative;
            z-index: 1;
        }
        footer a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>

    <nav>
        <div class="logo">Anu<span>Algo</span></div>
        <div>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="about.html">About</a>
            <a href="contact.html" class="active">Contact</a>
        </div>
    </nav>

    <div class="container">
        <h1>Stuck on a project? <span>Get in Touch</span></h1>
        
        <div class="contact-box">
            <p>Any questions about the migration kit, or if you're stuck on a project, reach out directly at:</p>
            <a href="mailto:anu@anualgo.com" class="email-link">anu@anualgo.com</a>
        </div>
    </div>

    <footer>
        <p>© 2026 Anu Algo · <a href="mailto:anu@anualgo.com">anu@anualgo.com</a></p>
    </footer>

    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        const chars = "01ANUALGOPI5XYZ$#<>_";
        const fontSize = 14;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = [];
        for (let i = 0; i < columns; i++) drops[i] = 1;
        function drawMatrix() {
            ctx.fillStyle = 'rgba(3, 7, 18, 0.12)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#22c55e';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 40);
    </script>
</body>
</html>
