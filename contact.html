<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — AnuAlgo</title>
    <style>
        :root {
            --bg: #030712;
            --surface: #0f172a;
            --border: #334155;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            line-height: 1.7;
        }
        nav {
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 1.25rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-weight: 800; font-size: 1.35rem; color: #fff; letter-spacing: -0.03em; }
        .logo span { color: var(--accent); }
        nav div a { color: var(--text-muted); text-decoration: none; margin-left: 2.5rem; font-size: 0.95rem; font-weight: 500; transition: color 0.2s; }
        nav div a:hover, nav div a.active { color: var(--accent); }

        .container {
            max-width: 800px;
            margin: 6rem auto;
            padding: 0 2rem;
        }
        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 1.5rem;
            color: #fff;
        }
        h1 span { color: var(--accent); }
        .contact-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 3rem;
            margin-top: 2rem;
        }
        .contact-box p {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }
        .email-link {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
            display: inline-block;
            word-break: break-all;
            transition: opacity 0.2s;
        }
        .email-link:hover { opacity: 0.8; }

        footer {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            margin-top: 8rem;
            font-size: 0.9rem;
        }
        footer a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">Anu<span>Algo</span></div>
        <div>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="about.html">About</a>
            <a href="contact.html" class="active">Contact</a>
        </div>
    </nav>

    <div class="container">
        <h1>Stuck on a project? <span>Get in Touch</span></h1>
        
        <div class="contact-box">
            <p>Any questions about the migration kit, or if you're stuck on a project, reach out directly at:</p>
            <a href="mailto:anu@anualgo.com" class="email-link">anu@anualgo.com</a>
        </div>
    </div>

    <footer>
        <p>© 2026 Anu Algo · <a href="mailto:anu@anualgo.com">anu@anualgo.com</a></p>
    </footer>
</body>
</html>
